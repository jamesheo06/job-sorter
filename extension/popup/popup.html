<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Job Sorter</title>
	<link rel="stylesheet" href="popup.css">
</head>

<body>

	<h2>Job Sorter</h2>

    <details id="resumeSection">
		<summary>Resume settings</summary>
		<textarea id="resumeInput" placeholder="Paste your resume text here..."></textarea>
		<button id="saveResumeBtn">Save Resume</button>
		<p id="resumeStatus"></p>
	</details>

	<button id="analyzeBtn">
		Analyze Job
	</button>

    <div id="resultSection" class="hidden">
		<h3 id="resultCategory"></h3>
		<p id="resultConfidence"></p>

        <details id="reasoningDetails">
			<summary>Why?</summary>
			<p id="resultReasoning"></p>
		</details>

		<div>
			<strong>Matching skills:</strong>
			<ul id="resultMatching"></ul>
		</div>
		<div>
			<strong>Missing skills:</strong>
			<ul id="resultMissing"></ul>
		</div>
	</div>

	<p id="errorMessage" class="hidden"></p>

	<script src="popup.js"></script>

</body>
</html>
